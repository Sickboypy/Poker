name: Deploy Swarm Descent
on:
  push:
    branches:
      - main
  workflow_dispatch:        # botón "Run workflow" en GitHub para desplegar a mano
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: swarm
      REGION: southamerica-east1     # São Paulo: la región más cercana a Paraguay
      # Reusa el Artifact Registry que ya existía para el póquer (no hay que crear nada)
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/poker-app/swarm:${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Authenticate Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
    - name: Build image
      run: docker build -t "$IMAGE" .
    - name: Push image
      run: docker push "$IMAGE"
    - name: Deploy Cloud Run
      # --timeout 3600: las conexiones WebSocket viven hasta 60 min (el juego reconecta solo)
      # --max-instances 1: la sala vive en memoria; todos tienen que caer en la misma instancia
      run: |
        gcloud run deploy "$SERVICE" \
          --image "$IMAGE" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated \
          --timeout 3600 \
          --max-instances 1 \
          --min-instances 0 \
          --concurrency 250 \
          --session-affinity
